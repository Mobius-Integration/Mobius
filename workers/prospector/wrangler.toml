# Prospecting digest and board for the founder. Nothing here is ever sent to a prospect.
# See README.md. Deploy (owner only): cd workers/prospector && npx wrangler deploy
# Secrets:  npx wrangler secret put FOUNDER_TO       (required: the founder's verified address)
#           npx wrangler secret put MAILING_ADDRESS  (optional: postal address for the email footer)
#           npx wrangler secret put ACTION_KEY       (optional: signs the board links; without it the Worker
#                                                     generates a random key once and keeps it in D1)
name = "mobius-prospector"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false
# The founder's prospect board lives under the site's own domain (signed links only, see src/board.js).
# "/ops" itself is the board's permanent address; "/ops/*" doesn't match it, so it has its own route.
routes = [
  { pattern = "mobiusintegration.com/ops", zone_name = "mobiusintegration.com" },
  { pattern = "mobiusintegration.com/ops/*", zone_name = "mobiusintegration.com" },
]

[triggers]
# UTC. Check a batch every 15 minutes; weekday digest at 13:00 UTC (8 AM Eastern in winter, 9 AM in summer).
# No cloud harvest: public Overpass servers refuse Cloudflare, so the prospect list is refreshed from the
# PC with scripts/harvest-local.mjs.
crons = ["*/15 * * * *", "0 13 * * MON-FRI"]

# Workers Paid (since 2026-11-20): 30 s of CPU per invocation instead of 10 ms.
[limits]
cpu_ms = 30000

[[d1_databases]]
binding = "DB"
database_name = "mobius-prospector"
database_id = "03234a5b-cf65-40d6-b823-c4aa29381fba"
migrations_dir = "migrations"

[ai]
binding = "AI"

# Sends only to the founder's address (enforced in code by sendToFounder).
[[send_email]]
name = "MAILER"

[vars]
# Since 2026-11-20 Google Workspace handles mail for mobiusintegration.com itself (mario@, hello@), so
# Cloudflare's Email Routing for this Worker runs on the subdomain in.mobiusintegration.com: digests
# come from prospects@in, and ops@in (reply commands, the hidden copy of sent emails) reaches the Worker.
FROM_ADDRESS = "prospects@in.mobiusintegration.com"
OPS_ADDRESS = "ops@in.mobiusintegration.com"
# The founder's Workspace address: accepted as a sender alongside FOUNDER_TO, and the account the
# Write in Gmail button opens on a computer.
FOUNDER_FROM = "mario@mobiusintegration.com"
SITE_NAME = "Mobius Integration"
BOARD_ORIGIN = "https://mobiusintegration.com"
# Hillsborough, Pinellas and Pasco plus Lakeland and Plant City (south,west,north,east), as a 4 x 5 grid
# of tiles no bigger than the 2 x 3 grid of the original, smaller box.
BBOX = "27.60,-82.85,28.40,-81.85"
GRID = "4x5"
CHECKS_PER_RUN = "10"
# Each weekday: up to DIGEST_SIZE new picks, but never more than READY_CAP waiting on the board.
DIGEST_SIZE = "5"
READY_CAP = "15"
# Referral partners per batch (weekday digest or Get more); the other places go to client prospects. "0" stops partners.
PARTNER_SLOTS = "1"
# Only prospects with at least one real finding (a score of 30 means base + one 15-point finding + phone).
MIN_SCORE = "30"
# The honest founding-client paragraph in every draft defaults to DEFAULT_FOUNDING_LINE in src/digest.js.
# Once the three founding spots are filled, turn it off with:  FOUNDING_LINE = ""

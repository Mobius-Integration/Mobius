# Cloudflare Pages configuration for the Mobius Integration site.
# Deploy with: npm run deploy
name = "mobius"
pages_build_output_dir = "_site"
compatibility_date = "2025-01-01"

# The contact form (functions/api/contact.js) stores each lead here.
# Read them with: npm run leads
[[kv_namespaces]]
binding = "LEADS"
id = "656311875d054e309f70e5dbb19a26ab"

# Cloudflare Pages configuration for the Mobius Integration site.
# Deploy with: npm run deploy  (pushes to GitHub master also deploy automatically)
name = "mobius"
pages_build_output_dir = "_site"
compatibility_date = "2025-01-01"

# The contact form (functions/api/contact.js) stores each lead here.
# Read them with: npm run leads
[[kv_namespaces]]
binding = "LEADS"
id = "656311875d054e309f70e5dbb19a26ab"

# Lead autopilot (workers/lead-alert): website pre-check, score, AI draft, alert email.
[[services]]
binding = "LEAD_ALERT"
service = "mobius-lead-alert"

# functions/_middleware.js sends www and the pages.dev address to this host.
# Set to "" to switch the redirect off.
[vars]
CANONICAL_HOST = "mobiusintegration.com"
